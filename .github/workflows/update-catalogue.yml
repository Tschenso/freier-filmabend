name: Filmkatalog täglich aktualisieren
on:
  workflow_dispatch:
  schedule:
    # Sommer/Winter: genau der Lauf um 06 Uhr in Berlin arbeitet.
    - cron: '7 4,5 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: online-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Öffentliche Metadaten sammeln, prüfen und online zurücklesen
        run: node src/update_online.mjs
