name: Filmkatalog täglich aktualisieren
on:
  workflow_dispatch:
  schedule:
    # Sommer/Winter: genau der Lauf um 06 Uhr in Berlin arbeitet.
    - cron: '7 4,5 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: online-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Öffentliche Metadaten sammeln, prüfen und online zurücklesen
        run: node src/update_online.mjs
